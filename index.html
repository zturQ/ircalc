<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IR calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="meme">
        <span class="label">Receita Federal me cobrando oq eu ja nao tenho:</span>
        <img src="include/rfmeme.jpg" alt="" width="100" height="100" id="rf">
    </div>
    <div class="meme">
        <span class="label">eu sonegando tudo:</span>
        <img src="include/eumeme.jpg" alt="" width="100" height="100" id="eu">
    </div>
        
    <div id="main">
        <img src="include/maneiro.jpg" id="imagemlegau" height="100" width="120">
        <div id="text">
            <h1>Calculadora de IR(Imposto de renda)</h1>
            <div id="input">   
                <label for="salary">Salario: </label>
                <input type="number" id="salary" value="Seu salário">
                <label for="dep">Dependentes: </label>
                <input type="number" id="dep">
                <button id="submit">-></button>
            </div>
                <br>
            <div id="return"></div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
